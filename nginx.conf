# Configuração Nginx para l2sistemas.api.br e *.l2sistemas.api.br
# Salve em /etc/nginx/sites-available/l2sistemas.api.br

server {
    listen 80;
    server_name l2sistemas.api.br *.l2sistemas.api.br;

    # Redireciona tudo para HTTPS após configurar o certificado SSL
    # return 301 https://$host$request_uri;

    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
